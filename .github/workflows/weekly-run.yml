name: Weekly digest run

on:
  schedule:
    # Monday 08:00 UTC. Walmart & Amazon are core/weekly per the spec;
    # Monday gives a clean look-back over the prior week.
    - cron: "0 8 * * 1"
  workflow_dispatch: {} # manual trigger, for testing without waiting a week

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run weekly pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Both optional — inbox ingestion (pipeline/feedback/ingest-inbox.ts)
          # gracefully skips itself when either is unset, same as the
          # Resend vars already do for email.
          FEEDBACK_INBOX_ADDRESS: ${{ secrets.FEEDBACK_INBOX_ADDRESS }}
          FEEDBACK_INBOX_APP_PASSWORD: ${{ secrets.FEEDBACK_INBOX_APP_PASSWORD }}
          MONTHLY_SPEND_LIMIT_USD: ${{ secrets.MONTHLY_SPEND_LIMIT_USD }}
        run: npm run weekly

      - name: Notify on failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional — falls back to a local file in the runner (lost when
          # the job ends) if unset, same graceful-fallback as every other
          # email send in this repo. Configure these to actually get paged.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
        run: npm run notify-failure -- weekly
